name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    # The built shop in a real browser (Google Chrome, preinstalled on the runner) against a
    # throwaway database: ordering in Arabic and French, the bot check, security headers,
    # keyboard behaviour of the pop-ups and the accessibility gate (axe, WCAG 2.1 AA: any
    # violation fails). Phone and computer run side by side, each with its own server.
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
    name: e2e (${{ matrix.project }})
    # a full run takes ~4 min: a hang fails the job instead of running on
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm run test:e2e -- --project=${{ matrix.project }}
        env:
          CI: "1"
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    # Production deploy from main. Needs repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
    # Switched off until Cloudflare is set up: create the repository variable DEPLOY_ENABLED = true
    # (GitHub → Settings → Secrets and variables → Actions → Variables) to turn it on.
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    environment: production
    env:
      # set → an encrypted backup (restore-tested) is taken before the migrations
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.PUBLIC_ORIGIN }}
          # refuse to deploy pages whose canonical links point to localhost
          REQUIRE_SITE_URL: "1"
      - name: Backup before migrations (when BACKUP_PASSPHRASE is set)
        if: env.BACKUP_PASSPHRASE != ''
        run: node scripts/backup.mjs backups && node scripts/restore-drill.mjs backups/*.sql.enc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Keep the pre-deploy backup
        if: env.BACKUP_PASSPHRASE != ''
        uses: actions/upload-artifact@v7
        with:
          name: backup-before-deploy-${{ github.run_number }}
          path: backups/
          retention-days: 56
      - name: Migration history matches the files?
        run: node scripts/check-migrations.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply henine-boutique-db --remote
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker + assets
        run: npx wrangler deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Is the new build live? (health + the home page loads this build's script)
        run: node scripts/verify-deploy.mjs ${{ vars.PUBLIC_ORIGIN }}
