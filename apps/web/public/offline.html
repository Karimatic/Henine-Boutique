<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Henine Boutique · بدون اتصال</title>
<link rel="icon" href="/icon.svg">
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fffbfc; color: #170a10; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; text-align: center; }
  main { max-width: 22rem; padding: 2rem 1.25rem; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.4rem; margin: 1rem 0 .4rem; }
  p { color: #5c4852; line-height: 1.6; margin: .3rem 0; }
  .fr { direction: ltr; font-size: .92rem; }
  button { margin-top: 1.4rem; height: 3rem; padding: 0 1.6rem; border: 0; border-radius: 999px; background: #8e1048; color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="">
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تحققي من الشبكة ثم أعيدي المحاولة. سلتك ومفضلتك محفوظة على هاتفك.</p>
  <p class="fr">Pas de connexion. Votre panier et vos favoris sont gardés sur votre téléphone.</p>
  <button type="button" onclick="location.reload()">إعادة المحاولة · Réessayer</button>
</main>
</body>
</html>
